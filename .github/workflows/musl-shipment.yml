name: Musl shipment

on:
  push:
    branches:
      - musl-shipment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64-musl:
    name: Linux x86_64 musl
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build musl binaries
        run: |
          mkdir -p shipment-artifacts
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/excalibur-control-center \
            rust:alpine3.22 \
            sh -euxc '
              apk add --no-cache build-base file fontconfig-dev libxkbcommon-dev pkgconf wayland-dev wayland-protocols
              rustc --version
              cargo build --locked --release --target x86_64-unknown-linux-musl \
                -p excalibur-control-center-gui \
                -p excalibur-control-center-cli
              install -Dm755 target/x86_64-unknown-linux-musl/release/excalibur-control-center-gui \
                /workspace/shipment-artifacts/excalibur-control-center-gui-musl
              install -Dm755 target/x86_64-unknown-linux-musl/release/excalibur-control-center-cli \
                /workspace/shipment-artifacts/excalibur-control-center-cli-musl
              file /workspace/shipment-artifacts/*
              stat -c "%n %s bytes" /workspace/shipment-artifacts/*
              sha256sum /workspace/shipment-artifacts/*
            '

      - name: Upload musl binaries
        uses: actions/upload-artifact@v4
        with:
          name: cecc-linux-musl-${{ github.sha }}
          path: shipment-artifacts/

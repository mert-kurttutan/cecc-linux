name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.read-release-version.outputs.release_version }}
      release_tag: ${{ steps.read-release-version.outputs.release_tag }}

    defaults:
      run:
        working-directory: excalibur-control-center

    env:
      ASSET_DIR: release-assets
      NFPM_VERSION: 2.47.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: read-release-version
        run: |
          python3 - <<'PY'
          import pathlib
          import os
          import sys
          import tomllib

          crates = {
              "gui": pathlib.Path("gui/Cargo.toml"),
              "cli": pathlib.Path("cli/Cargo.toml"),
              "backend": pathlib.Path("backend/Cargo.toml"),
          }
          versions = {
              name: tomllib.loads(path.read_text())["package"]["version"]
              for name, path in crates.items()
          }
          gui_version = versions["gui"]
          mismatches = {
              name: version
              for name, version in versions.items()
              if version != gui_version
          }
          if mismatches:
              print(f"Version mismatch: {versions}", file=sys.stderr)
              sys.exit(1)

          release_tag = f"v{gui_version}"

          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"RELEASE_VERSION={gui_version}", file=env)
              print(f"RELEASE_TAG={release_tag}", file=env)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"release_version={gui_version}", file=output)
              print(f"release_tag={release_tag}", file=output)
          PY

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: excalibur-control-center

      - name: Build release binaries
        run: |
          cargo build --release \
            -p excalibur-control-center-gui \
            -p excalibur-control-center-cli

      - name: Prepare release assets
        run: |
          mkdir -p "../$ASSET_DIR"
          install -m 0755 target/release/excalibur-control-center-gui \
            "../$ASSET_DIR/excalibur-control-center-gui"
          install -m 0755 target/release/excalibur-control-center-cli \
            "../$ASSET_DIR/excalibur-control-center-cli"

      - name: Install nFPM
        working-directory: .
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build Linux packages
        working-directory: .
        run: |
          mkdir -p "$ASSET_DIR"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import shutil

          source = pathlib.Path("packaging/nfpm.yaml")
          target = pathlib.Path("packaging/nfpm.release.yaml")
          config = source.read_text()
          config = config.replace("__VERSION__", os.environ["RELEASE_VERSION"])
          target.write_text(config)

          driver_source = pathlib.Path("casper-wmi")
          driver_stage = pathlib.Path("packaging/build/casper-wmi")
          shutil.rmtree(driver_stage, ignore_errors=True)
          driver_stage.mkdir(parents=True)
          dkms_conf = (driver_source / "dkms.conf").read_text()
          dkms_conf, replacements = re.subn(
              r'^PACKAGE_VERSION="[^"]+"$',
              f'PACKAGE_VERSION="{os.environ["RELEASE_VERSION"]}"',
              dkms_conf,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one PACKAGE_VERSION in casper-wmi/dkms.conf")
          (driver_stage / "dkms.conf").write_text(dkms_conf)
          PY
          nfpm package \
            --config packaging/nfpm.release.yaml \
            --packager deb \
            --target "$ASSET_DIR"
          nfpm package \
            --config packaging/nfpm.release.yaml \
            --packager rpm \
            --target "$ASSET_DIR"

      - name: Generate checksums
        working-directory: .
        run: |
          sha256sum "$ASSET_DIR"/* \
            > "$ASSET_DIR/SHA256SUMS"

      - name: Create release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG"

      - name: Upload release assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/*

  post-release-smoke:
    name: Post-release smoke
    runs-on: ubuntu-latest
    needs: linux-x86_64

    env:
      RELEASE_VERSION: ${{ needs.linux-x86_64.outputs.release_version }}
      RELEASE_TAG: ${{ needs.linux-x86_64.outputs.release_tag }}

    steps:
      - name: Smoke test public curl installer
        run: |
          set -o pipefail

          curl -fsSL https://raw.githubusercontent.com/mert-kurttutan/cecc-linux/main/scripts/driver-bash/install-release.sh \
            | sudo bash -s -- --version "$RELEASE_TAG" --skip-driver

          test -x /usr/local/bin/excalibur-control-center-gui
          test -x /usr/local/bin/excalibur-control-center-cli
          /usr/local/bin/excalibur-control-center-cli --help >/dev/null

      - name: Smoke test public curl uninstaller
        if: always()
        run: |
          set -o pipefail

          curl -fsSL https://raw.githubusercontent.com/mert-kurttutan/cecc-linux/main/scripts/driver-bash/uninstall-release.sh \
            | sudo bash -s -- --keep-driver

          test ! -e /usr/local/bin/excalibur-control-center-gui
          test ! -e /usr/local/bin/excalibur-control-center-cli

      - name: Smoke test Debian package
        run: |
          app_package="excalibur-control-center_${RELEASE_VERSION}_amd64.deb"
          url="https://github.com/mert-kurttutan/cecc-linux/releases/download/${RELEASE_TAG}/${app_package}"

          curl -fL "$url" -o "$app_package"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "./$app_package"

          test -x /usr/bin/excalibur-control-center-gui
          test -x /usr/bin/excalibur-control-center-cli
          /usr/bin/excalibur-control-center-cli --help >/dev/null
          test -f "/usr/src/casper-wmi-${RELEASE_VERSION}/dkms.conf"
          sudo dkms status -m casper-wmi -v "$RELEASE_VERSION" \
            | grep -F "casper-wmi/$RELEASE_VERSION"

      - name: Remove Debian package
        if: always()
        run: |
          sudo apt-get remove -y excalibur-control-center || true
          test ! -e /usr/bin/excalibur-control-center-gui
          test ! -e /usr/bin/excalibur-control-center-cli
          if sudo dkms status -m casper-wmi -v "$RELEASE_VERSION" 2>/dev/null \
            | grep -q "casper-wmi/$RELEASE_VERSION"; then
            echo "casper-wmi remained registered after package removal" >&2
            exit 1
          fi

  post-release-fedora-smoke:
    name: Post-release Fedora smoke
    runs-on: ubuntu-latest
    needs: linux-x86_64
    container:
      image: fedora:latest

    env:
      RELEASE_VERSION: ${{ needs.linux-x86_64.outputs.release_version }}
      RELEASE_TAG: ${{ needs.linux-x86_64.outputs.release_tag }}

    steps:
      - name: Install smoke-test dependencies
        run: |
          dnf install -y ca-certificates curl

      - name: Smoke test RPM package
        run: |
          package="excalibur-control-center-${RELEASE_VERSION}-1.x86_64.rpm"
          url="https://github.com/mert-kurttutan/cecc-linux/releases/download/${RELEASE_TAG}/${package}"

          curl -fL "$url" -o "$package"
          dnf install -y "./$package"

          test -x /usr/bin/excalibur-control-center-gui
          test -x /usr/bin/excalibur-control-center-cli
          /usr/bin/excalibur-control-center-cli --help >/dev/null

      - name: Remove RPM package
        if: always()
        run: |
          dnf remove -y excalibur-control-center || true
          test ! -e /usr/bin/excalibur-control-center-gui
          test ! -e /usr/bin/excalibur-control-center-cli

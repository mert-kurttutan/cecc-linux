name: excalibur-control-center
arch: amd64
platform: linux
version: "__VERSION__"
section: utils
priority: optional
maintainer: "Mert Kurttutan"
homepage: "https://github.com/mert-kurttutan/cecc-linux"
description: "Linux control center for Casper Excalibur laptops."
vendor: "mert-kurttutan"
contents:
  - src: release-assets/excalibur-control-center-gui
    dst: /usr/bin/excalibur-control-center-gui
    file_info:
      mode: 0755
  - src: release-assets/excalibur-control-center-cli
    dst: /usr/bin/excalibur-control-center-cli
    file_info:
      mode: 0755
  - src: scripts/driver-bash/apply-sysfs-permissions.sh
    dst: /usr/local/libexec/excalibur-control-center/apply-sysfs-permissions
    file_info:
      mode: 0755
  - src: casper-wmi/90-excalibur-control-center.rules
    dst: /usr/lib/udev/rules.d/90-excalibur-control-center.rules
    file_info:
      mode: 0644
  - src: casper-wmi/casper-wmi.c
    dst: /usr/src/casper-wmi-__VERSION__/casper-wmi.c
    packager: deb
    file_info:
      mode: 0644
  - src: casper-wmi/casper-gpu-mode.c
    dst: /usr/src/casper-wmi-__VERSION__/casper-gpu-mode.c
    packager: deb
    file_info:
      mode: 0644
  - src: casper-wmi/Makefile
    dst: /usr/src/casper-wmi-__VERSION__/Makefile
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/build/casper-wmi/dkms.conf
    dst: /usr/src/casper-wmi-__VERSION__/dkms.conf
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/excalibur-control-center.desktop
    dst: /usr/share/applications/excalibur-control-center.desktop
    file_info:
      mode: 0644
  - src: packaging/excalibur-control-center.svg
    dst: /usr/share/icons/hicolor/scalable/apps/excalibur-control-center.svg
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/rpm/postinstall.sh
  postremove: packaging/deb/postremove.sh
overrides:
  deb:
    depends:
      - bash
      - libc6
      - libfontconfig1
      - libgcc-s1
      - libwayland-client0
      - libxkbcommon0
      - udev
      - dkms
      - build-essential
    recommends:
      - linux-headers-amd64 | linux-headers-generic
    scripts:
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
      postremove: packaging/deb/postremove.sh
  rpm:
    depends:
      - bash
      - glibc
      - fontconfig
      - libgcc
      - libwayland-client
      - libxkbcommon
      - systemd-udev
rpm:
  group: Applications/System
  summary: Linux control center for Casper Excalibur laptops
